<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しかくしえん カード</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f08a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="しかくカード">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style id="pagesize">@page { size: A4 portrait; margin: 0; }</style>
<style>
  /* しくみ：うえに タブと ボタン、ひだりに へんしゅう、みぎに いんさつ する かみの みほん。スマホでは みほん → へんしゅうの じゅん。
     かみの みほん（.page）は いつも しろい かみの まま。 */
  :root {
    --ui-bg: #efe9de; --ui-surface: #ffffff; --ui-soft: #fffaf2; --ui-row: #fffdf9; --ui-fg: #333333; --ui-muted: #6d5b45;
    --ui-line: #e0d6c6; --ui-line2: #f1ebe1; --ui-panel: #f3d9b5; --ui-active: #ffe0b2; --ui-tip: #fff8e1; --ui-head: #e65100; --ui-warn: #c62828;
    --accent: #f08a24; --line: var(--ui-line); --panel: var(--ui-panel);
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ui-bg: #1f1b16; --ui-surface: #2a251f; --ui-soft: #332c24; --ui-row: #2f2922; --ui-fg: #eee6da; --ui-muted: #c9b9a3;
      --ui-line: #4a4036; --ui-line2: #3d352c; --ui-panel: #5a4630; --ui-active: #6b4a22; --ui-tip: #3a3020; --ui-head: #ffb26b; --ui-warn: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ui-bg: #1f1b16; --ui-surface: #2a251f; --ui-soft: #332c24; --ui-row: #2f2922; --ui-fg: #eee6da; --ui-muted: #c9b9a3;
    --ui-line: #4a4036; --ui-line2: #3d352c; --ui-panel: #5a4630; --ui-active: #6b4a22; --ui-tip: #3a3020; --ui-head: #ffb26b; --ui-warn: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  [hidden] { display: none !important; }
  body { font-family: "Kosugi Maru", "Meiryo", sans-serif; background: var(--ui-bg); color: var(--ui-fg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ui-surface); border-bottom: 2px solid var(--panel); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header .group { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--ui-soft); color: var(--ui-fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.active { background: var(--ui-active); border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { padding: 6px 16px; font-size: 14px; color: var(--ui-muted); min-height: 30px; }
  #status.warn { color: var(--ui-warn); }
  main { display: flex; gap: 14px; padding: 0 16px 24px; align-items: flex-start; }
  .editor { width: 400px; flex: none; background: var(--ui-surface); border: 2px solid var(--panel); border-radius: 16px; padding: 12px 14px; max-height: calc(100vh - 110px); overflow: auto; }
  .preview { flex: 1; min-width: 0; }
  @media (max-width: 960px) { main { flex-direction: column; align-items: stretch; } .editor { width: auto; max-height: none; } }
  @media (max-width: 700px) {
    header { position: static; }
    #tabs { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 4px; }
    #tabs button { flex: none; }
    button { font-size: 14px; padding: 7px 10px; }
    .preview { order: -1; }
    .editor { padding: 10px; }
    .iconbtn { width: 56px; height: 56px; font-size: 56px; }
  }
  .editor h3 { margin: 4px 0 10px; color: var(--ui-head); font-size: 18px; }
  .editor h4 { margin: 14px 0 6px; font-size: 15px; }
  .editor label { display: block; font-size: 14px; margin: 6px 0; }
  .editor input[type=text], .editor select { font: inherit; font-size: 16px; padding: 6px 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--ui-surface); color: var(--ui-fg); }
  .editor input[type=text] { width: 100%; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .irow { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border: 2px solid var(--ui-line2); border-radius: 12px; margin: 6px 0; background: var(--ui-row); }
  .iconbtn { width: 64px; height: 64px; padding: 0; font-size: 64px; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; background: #fff; }
  .iconbtn .ic-emo { font-size: .6em; }
  .ifields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ifields .sub { display: flex; gap: 4px; }
  .ifields .sub input { flex: 1; min-width: 0; }
  .ifields input.time { width: 80px; flex: none; }
  .iops { display: flex; flex-direction: column; gap: 3px; }
  .iops button { padding: 2px 8px; font-size: 13px; }
  .swatches { display: flex; gap: 4px; flex-wrap: wrap; }
  .swatches button { width: 24px; height: 24px; border-radius: 50%; padding: 0; }
  .swatches button.active { outline: 3px solid var(--ui-fg); outline-offset: 1px; }
  .tips { margin-top: 16px; background: var(--ui-tip); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.7; }
  .tips b { color: var(--ui-head); }
  .tips ul { margin: 4px 0 0; padding-left: 18px; }

  /* ---- がめんで みせる ---- */
  .show { position: fixed; inset: 0; z-index: 30; background: #222; overflow: auto; padding: calc(env(safe-area-inset-top, 0px) + 56px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .showbar { position: fixed; top: 0; left: 0; right: 0; z-index: 31; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; background: rgba(0,0,0,.7); color: #fff; font-size: 13px; }
  .showbar button { background: #fff; color: #333; border-color: #fff; }
  .showin { margin: 0 auto; width: 100%; }
  .showin [data-id] { cursor: pointer; }
  .done .scheck { background: var(--c); border-style: solid; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
  .done .scheck::after { content: '✔'; }
  .srow.done .scheck { font-size: calc(var(--rh) * 0.38); }
  .hcard.done .scheck { font-size: calc(var(--w) * 0.22); }
  .done .ibox, .done .slabel, .done .hlabel, .done .stime, .done .htime { opacity: .35; }
  .showin.landscape { max-width: calc((100dvh - 80px) * 297 / 210); }
  .showin.portrait { max-width: calc((100dvh - 80px) * 210 / 297); }
  .showin .page { max-width: none; }

  /* ---- いんさつ する ページ ---- */
  .page { position: relative; background: #fff; color: #333; container-type: inline-size; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.15); border-radius: 6px; margin: 0 auto 18px; }
  .page.portrait { aspect-ratio: 210 / 297; max-width: 600px; }
  .page.landscape { aspect-ratio: 297 / 210; }
  .pin { position: absolute; inset: 0; padding: 4cqw; display: flex; flex-direction: column; }
  .ptitle { text-align: center; color: #e65100; font-weight: bold; font-size: 6.4cqw; line-height: 1.3; }
  .landscape .ptitle { font-size: 4.6cqw; }
  .pdate { text-align: right; color: #999; font-size: 2.8cqw; }
  .landscape .pdate { font-size: 2cqw; }
  .ic-emo { font-family: var(--emoji); line-height: 1; }
  .slabel, .hlabel, .vlabel, .vnote, .ftlabel, .clabel, .ptitle { word-break: keep-all; overflow-wrap: anywhere; }
  .ic-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ibox { width: var(--s); height: var(--s); font-size: var(--s); flex: none; display: flex; align-items: center; justify-content: center; background: #fff; border: .5cqw solid var(--c, #ccc); border-radius: 14%; overflow: hidden; }
  .ibox .ic-emo { font-size: .7em; }

  /* スケジュール たて */
  .srows { flex: 1; display: flex; flex-direction: column; gap: 1.8cqw; margin-top: 1.5cqw; }
  .checkhead { text-align: right; font-size: 2.6cqw; color: #999; margin: 1cqw 2cqw 0 0; }
  .srow { display: flex; align-items: center; gap: 3cqw; height: var(--rh); background: var(--bg); border-left: 2.2cqw solid var(--c); border-radius: 2cqw; padding: 0 2.5cqw 0 2cqw; }
  .srow .ibox { --s: calc(var(--rh) * 0.8); }
  .slabel { flex: 1; font-size: min(7cqw, calc(var(--rh) * 0.32)); line-height: 1.25; }
  .stime { width: 12cqw; flex: none; font-size: min(4.2cqw, calc(var(--rh) * 0.24)); color: #555; text-align: center; }
  .scheck { width: calc(var(--rh) * 0.62); height: calc(var(--rh) * 0.62); flex: none; border: .6cqw dashed var(--c); border-radius: 50%; background: #fff; }
  /* スケジュール よこ */
  .hrows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
  .hrow { display: flex; align-items: center; justify-content: center; gap: .8cqw; }
  .hcard { width: calc(var(--w) + 2cqw); background: var(--bg); border-top: 1.2cqw solid var(--c); border-radius: 1.6cqw; padding: 1cqw; display: flex; flex-direction: column; align-items: center; gap: .6cqw; }
  .hcard .ibox { --s: var(--w); }
  .hlabel { font-size: min(2.6cqw, calc(var(--w) * 0.17)); text-align: center; line-height: 1.25; }
  .htime { font-size: min(2cqw, calc(var(--w) * 0.13)); color: #555; }
  .hcard .scheck { width: calc(var(--w) * 0.36); height: calc(var(--w) * 0.36); }
  .harrow { color: #c8c8c8; font-size: 2.2cqw; }
  .hcard { position: relative; }
  .hnum { position: absolute; top: -1.8cqw; left: -1.4cqw; width: calc(var(--w) * 0.3); height: calc(var(--w) * 0.3); border-radius: 50%; background: var(--c); color: #fff; border: .4cqw solid #fff; font-size: calc(var(--w) * 0.17); font-weight: bold; display: flex; align-items: center; justify-content: center; }
  /* しゅうかん よてい */
  .wgrid { flex: 1; display: grid; grid-template-columns: repeat(var(--days), 1fr); gap: 1cqw; margin-top: 1cqw; min-height: 0; }
  .wcol { display: flex; flex-direction: column; gap: .8cqw; background: #fafafa; border-radius: 1.6cqw; padding: .8cqw; min-width: 0; }
  .wdate { margin-left: .8cqw; font-size: .85em; }
  .pdate.filled { color: #555; font-size: 3.4cqw; }
  .landscape .pdate.filled { font-size: 2.4cqw; }
  .dateinput { font: inherit; font-size: 16px; padding: 6px 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--ui-surface); color: var(--ui-fg); }
  .whead { background: var(--wc); color: #fff; text-align: center; border-radius: 1.2cqw; font-size: 2.6cqw; font-weight: bold; padding: .4cqw 0; }
  .witem { height: var(--ih); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3cqw; background: var(--bg); border-top: .6cqw solid var(--c); border-radius: 1cqw; padding: .4cqw .3cqw; }
  .witem .ibox { --s: var(--is); border: none; background: transparent; }
  .wlabel { font-size: var(--fs); text-align: center; line-height: 1.15; word-break: keep-all; overflow-wrap: anywhere; }
  /* きもち ボード */
  .fgrid { flex: 1; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-auto-rows: 1fr; gap: 2.4cqw; margin-top: 2cqw; }
  .fcell { background: var(--bg); border: .8cqw solid var(--c); border-radius: 3cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1cqw; min-height: 0; }
  .fcell .ibox { --s: var(--is); border: none; background: transparent; }
  .flabel { font-size: calc(var(--is) * 0.22); text-align: center; line-height: 1.2; word-break: keep-all; overflow-wrap: anywhere; }
  /* かわったよ カード */
  .card.change { background: repeating-linear-gradient(-45deg, #ffd54f 0 2.2cqw, #fff3c4 2.2cqw 4.4cqw); border-color: #f57f17; }
  .card.change .ibox { background: #fff; border-radius: 50%; }
  .card.change .clabel { background: #fff; border-radius: 4cqw; padding: .6cqw 2cqw; font-weight: bold; color: #e65100; }
  /* ごほうび */
  .rband { display: flex; align-items: center; justify-content: center; gap: 2cqw; margin-top: 1.5cqw; }
  .rbox { display: flex; align-items: center; gap: 1.6cqw; background: var(--bg); border: .6cqw solid var(--c); border-radius: 2.4cqw; padding: 1cqw 2cqw; }
  .rbox .ibox { --s: 11cqw; border: none; background: transparent; }
  .rcap { font-size: 1.8cqw; color: #777; }
  .rlabel { font-size: 3.2cqw; }
  .rmid { text-align: center; color: #e65100; font-size: 2.6cqw; line-height: 1.4; }
  .rmid b { font-size: 3.6cqw; }
  .rgrid { flex: 1; display: grid; grid-template-columns: repeat(var(--cols), var(--d)); grid-auto-rows: var(--d); gap: 2cqw; justify-content: center; align-content: center; }
  .rdot { border: .5cqw dashed #f9a825; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #e8d9b0; font-size: calc(var(--d) * 0.36); font-weight: bold; }
  .rdot.last { border: .7cqw solid #f57f17; background: #fff8e1; color: #f57f17; }
  /* こえの ものさし */
  .vrow { flex: 1; display: flex; gap: 1.6cqw; margin-top: 1.5cqw; }
  .vcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; background: #fafafa; border-radius: 2cqw; padding: 1.4cqw 1cqw; }
  .vvis { height: 37cqw; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .vicon { width: 1em; height: 1em; display: flex; align-items: center; justify-content: center; margin-bottom: .8cqw; border-radius: 50%; overflow: hidden; }
  .vicon .ic-emo { font-size: .9em; }
  .vbar { width: 80%; background: var(--c); border-radius: 1.4cqw 1.4cqw 0 0; display: flex; justify-content: center; color: #fff; font-size: 3.4cqw; font-weight: bold; padding-top: .5cqw; }
  .vlabel { margin-top: 1.4cqw; font-size: 2.4cqw; background: #fff; border: .4cqw solid var(--c); border-radius: 5cqw; padding: .5cqw 1.4cqw; text-align: center; line-height: 1.3; }
  .vnote { margin-top: 1cqw; font-size: 2cqw; color: #555; text-align: center; line-height: 1.4; }
  /* まず・つぎ */
  .ftrow { position: absolute; inset: 4cqw; display: flex; align-items: center; gap: 2.5cqw; }
  .ftbox { flex: 1; height: 100%; border: 1cqw solid var(--c); border-radius: 3cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqw; }
  .fthead { background: var(--c); color: #fff; font-size: 5cqw; padding: .6cqw 5cqw; border-radius: 6cqw; }
  .ftbox .ibox { --s: 27cqw; border: none; }
  .ftlabel { font-size: 5cqw; text-align: center; }
  .ftarrow { color: #f08a24; font-size: 7cqw; }
  /* カード */
  .cgrid { position: absolute; inset: 4cqw; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); }
  .ccell { border: .25cqw dashed #c4c4c4; display: flex; align-items: center; justify-content: center; padding: 1.6cqw; margin: -.125cqw; }
  .card { width: 100%; height: 100%; background: var(--bg); border: .9cqw solid var(--c); border-radius: 3cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1cqw; }
  .card .ibox { --s: calc(var(--cw) * 0.6); border: none; background: transparent; }
  .clabel { font-size: calc(var(--cw) * 0.11); text-align: center; line-height: 1.2; padding: 0 1cqw; }

  /* シール ようし */
  .lab { position: absolute; }
  .lab .lin { position: absolute; inset: var(--pad); border-radius: var(--rad); background: var(--bg); display: flex; flex-direction: var(--dir); align-items: center; justify-content: center; gap: var(--gap); overflow: hidden; }
  .lab.round .lin { border-radius: 50%; }
  .lab .ibox { --s: var(--is); border: none; background: transparent; }
  .ltext { max-width: var(--tw); font-size: var(--fs); line-height: 1.2; text-align: center; word-break: keep-all; overflow-wrap: anywhere; }
  .guide { position: absolute; border: .15cqw dashed #9e9e9e; border-radius: var(--grad); pointer-events: none; }
  .lspec { font-size: 13px; color: var(--ui-muted); background: var(--ui-soft); border-radius: 10px; padding: 8px 10px; line-height: 1.6; }
  .numrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 10px; }
  .numrow label { margin: 2px 0; }
  .numrow input { width: 100%; font: inherit; font-size: 15px; padding: 4px 6px; border: 2px solid var(--line); border-radius: 8px; background: var(--ui-surface); color: var(--ui-fg); }

  /* えらぶ まど */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .modal[hidden] { display: none; }
  .mbox { background: var(--ui-surface); border-radius: 18px; width: min(680px, 100%); max-height: 90vh; overflow: auto; padding: 14px; }
  .mhead { display: flex; justify-content: space-between; align-items: center; font-size: 18px; color: var(--ui-head); margin-bottom: 8px; }
  .mtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .mtabs button { font-size: 14px; padding: 6px 10px; }
  .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .mgrid button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 13px; }
  .mgrid .ic-emo { font-size: 34px; display: block; height: 42px; line-height: 42px; }
  .photobusy { margin: 8px 0 0; color: var(--ui-head); font-size: 15px; }
  .photo { display: block; margin-top: 12px; padding: 10px; border: 2px dashed var(--line); border-radius: 12px; font-size: 15px; }

  @media print {
    header, .editor, #status, .modal, .show { display: none !important; }
    body { background: #fff; }
    main { display: block; padding: 0; }
    .page { box-shadow: none; border-radius: 0; margin: 0; max-width: none; break-after: page; page-break-after: always; }
    .page:last-child { break-after: auto; page-break-after: auto; }
    .page.portrait { width: 210mm; height: 297mm; aspect-ratio: auto; }
    .page.landscape { width: 297mm; height: 210mm; aspect-ratio: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="group" id="tabs">
    <button data-tab="schedule">📅 スケジュール</button>
    <button data-tab="steps">🔢 てじゅん</button>
    <button data-tab="firstThen">➡ まず・つぎ</button>
    <button data-tab="voice">🔊 こえの ものさし</button>
    <button data-tab="feel">😊 きもち ボード</button>
    <button data-tab="change">🔄 かわったよ</button>
    <button data-tab="reward">⭐ ごほうび</button>
    <button data-tab="cards">🃏 えカード</button>
    <button data-tab="label">🏷 シール ようし</button>
  </div>
  <div class="group">
    <button id="undo">↩ もどす</button>
    <button id="showBtn">📺 みせる</button>
    <button id="print" class="primary">🖨 いんさつ</button>
    <button id="printFile" class="primary" hidden>🖨 いんさつ よう ファイル</button>
    <button id="saveFile">💾 ファイルに ほぞん</button>
    <button id="openFile">📂 ファイルを ひらく</button>
    <input type="file" id="openInput" accept=".json,.txt,application/json,text/plain" hidden>
  </div>
</header>
<div id="status"></div>
<main>
  <section class="editor" id="editor"></section>
  <section class="preview" id="preview"></section>
</main>

<div class="show" id="show" hidden>
  <div class="showbar"><span id="showHint">スマホを よこに すると おおきく みえます</span><button id="showReset" hidden>✔ ぜんぶ けす</button><button id="showClose">✕ とじる</button></div>
  <div class="showin" id="showIn"></div>
</div>

<div class="modal" id="picker" hidden>
  <div class="mbox">
    <div class="mhead"><span>えを えらぶ</span><button data-act="close">とじる</button></div>
    <div class="mtabs" id="mtabs"></div>
    <div class="mgrid" id="mgrid"></div>

    const cells = d.items.map((x) => `<div class="fcell" style="${catStyle(x.cat)}"><div class="ibox">${iconHtml(x.icon)}</div><div class="flabel">${esc(x.label)}</div></div>`).join('');
    return { orient: 'portrait', html: `<div class="page portrait" style="--cols:${cols};--is:${is.toFixed(2)}cqw"><div class="pin"><div class="ptitle">${esc(d.title)}</div><div class="fgrid">${cells}</div></div></div>` };
  }
  function rewardPages(d) {
    const c = Math.max(1, +d.count || 10);
    const cols = c <= 6 ? c : c <= 12 ? Math.ceil(c / 2) : c <= 18 ? Math.ceil(c / 3) : Math.ceil(c / 4);
    const rows = Math.ceil(c / cols);
    const dsz = Math.min(15, (88 - (cols - 1) * 2) / cols, (33 - (rows - 1) * 2) / rows);
    let dots = '';
    for (let i = 1; i <= c; i++) dots += `<div class="rdot ${i === c ? 'last' : ''}">${i === c ? '★' : i}</div>`;
    const box = (cap, x) => `<div class="rbox" style="${catStyle(x.cat)}"><div class="ibox">${iconHtml(x.icon)}</div><div><div class="rcap">${cap}</div><div class="rlabel">${esc(x.label)}</div></div></div>`;
    return { orient: 'landscape', html: `<div class="page landscape" style="--cols:${cols};--d:${dsz.toFixed(2)}cqw"><div class="pin">
      <div class="ptitle">${esc(d.title)}</div>
      <div class="rband">${box('がんばること', d.task)}<div class="rmid">シールが<br><b>${c}こ</b><br>たまったら ▶</div>${box('ごほうび', d.prize)}</div>

  function voicePages(d) {
    const n = d.levels.length;

    }).join('');

  function firstThenPages(d) {
    const box = (word, x, c) => `<div class="ftbox" style="--c:${c}"><div class="fthead">${esc(word)}</div>

  }
  function labelSpec(d) {
    if (d.preset === 'custom') {
      const c = d.custom, n = (v, def) => (isFinite(parseFloat(v)) ? parseFloat(v) : def);
      const w = Math.max(5, n(c.w, 50)), h = Math.max(5, n(c.h, 30));
      return { id: 'custom', cols: Math.max(1, Math.round(n(c.cols, 1))), rows: Math.max(1, Math.round(n(c.rows, 1))), w, h,
        left: n(c.left, 0), top: n(c.top, 0), px: n(c.px, w), py: n(c.py, h), round: !!c.round };
    }
    return LABELS.find((l) => l.id === d.preset) || LABELS[0];
  }
  function labelCell(L, x, pos, ox, oy, color) {
    const k = 100 / 210, f = (v) => (v * k).toFixed(3) + 'cqw';
    const c = pos % L.cols, r = Math.floor(pos / L.cols);
    const X = L.left + c * L.px + ox, Y = L.top + r * L.py + oy;
    const pad = Math.min(1.5, Math.min(L.w, L.h) * 0.06);
    const iw = L.w - 2 * pad, ih = L.h - 2 * pad;
    const text = String(x.label || '').trim();
    // スペースの ところで だけ かいぎょう する ので、いちばん ながい ことばと ぎょうすうで もじの おおきさを きめる
    const words = text ? text.split(/\s+/) : [], longest = Math.max(1, ...words.map((w) => [...w].length)), lines = Math.max(1, words.length);
    const fit = (cap, width, height) => Math.min(cap, width / longest, height / lines / 1.25);
    let dir = 'column', is, fs = 0, tw = iw;
    const gap = Math.min(iw, ih) * 0.05;
    if (L.round) { const D = Math.min(iw, ih); is = text ? D * 0.5 : D * 0.7; tw = D * 0.75; fs = fit(D * 0.16, tw, D * 0.32); }
    else if (!text) { is = Math.min(iw, ih) * 0.8; }
    else if (iw / ih >= 1.45) { dir = 'row'; is = ih * 0.78; tw = iw - is - gap - 2; fs = fit(ih * 0.3, tw, ih * 0.9); }
    else { is = Math.min(iw * 0.75, ih * 0.6); tw = iw * 0.95; fs = fit(ih * 0.16, tw, ih - is - gap); }
    const bg = color ? catOf(x.cat).bg : '#fff';
    const rad = Math.min(3, Math.min(L.w, L.h) * 0.12);
    return `<div class="lab ${L.round ? 'round' : ''}" style="left:${f(X)};top:${f(Y)};width:${f(L.w)};height:${f(L.h)};--pad:${f(pad)};--rad:${f(rad)};--bg:${bg};--dir:${dir};--gap:${f(gap)};--is:${f(is)};--fs:${f(fs)};--tw:${f(tw)}">
      <div class="lin"><div class="ibox">${iconHtml(x.icon)}</div>${text ? `<div class="ltext">${esc(text)}</div>` : ''}</div></div>`;
  }
  function labelPages(d) {
    const L = labelSpec(d), per = L.cols * L.rows, k = 100 / 210, f = (v) => (v * k).toFixed(3) + 'cqw';
    const start = Math.min(per, Math.max(1, Math.round(parseFloat(d.start) || 1))) - 1;
    const items = d.items;
    let seq = [];
    if (items.length) {
      if (d.mode === 'repeat') for (let i = 0; i < per - start; i++) seq.push(items[i % items.length]);
      else seq = items.slice();
    }
    const ox = parseFloat(d.offX) || 0, oy = parseFloat(d.offY) || 0;
    const pages = [];
    let idx = 0, first = true;
    do {
      const slots = [];
      for (let pos = first ? start : 0; pos < per && idx < seq.length; pos++) slots.push([pos, seq[idx++]]);
      pages.push(slots);
      first = false;
    } while (idx < seq.length);
    const html = pages.map((slots) => {
      let h = '';
      for (let pos = 0; pos < per; pos++) {
        const c = pos % L.cols, r = Math.floor(pos / L.cols);
        h += `<div class="guide ${d.outline ? '' : 'no-print'}" style="left:${f(L.left + c * L.px + ox)};top:${f(L.top + r * L.py + oy)};width:${f(L.w)};height:${f(L.h)};--grad:${L.round ? '50%' : f(1.5)}"></div>`;
      }
      slots.forEach(([pos, x]) => { h += labelCell(L, x, pos, ox, oy, d.color); });
      return `<div class="page portrait">${h}</div>`;
    }).join('');
    return { orient: 'portrait', html };
  }
  function changePages(d) { return cardPages(d, 'change'); }
  function cardPages(d, variant = '') {
    const cols = { l: 2, m: 3, s: 4 }[d.size] || 3, rows = { l: 3, m: 4, s: 5 }[d.size] || 4, per = cols * rows;
    const cw = 92 / cols;
    let html = '';
    for (let p = 0; p < Math.max(1, Math.ceil(d.items.length / per)); p++) {
      const cells = d.items.slice(p * per, (p + 1) * per).map((x) => `<div class="ccell"><div class="card ${variant}" style="${catStyle(x.cat)}">
        <div class="ibox">${iconHtml(x.icon)}</div><div class="clabel">${esc(x.label)}</div></div></div>`).join('');
      html += `<div class="page portrait" style="--cols:${cols};--rows:${rows};--cw:${cw.toFixed(2)}cqw"><div class="cgrid">${cells}</div></div>`;
    }
    return { orient: 'portrait', html };
  }
  const PAGES = { schedule: schedulePages, steps: stepsPages, voice: voicePages, firstThen: firstThenPages, feel: feelPages, change: changePages, reward: rewardPages, cards: (d) => cardPages(d), label: labelPages };
  function renderPreview() {

  const HEIC_LIB = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
  const HEIC_SRI = 'sha384-OTofQ0MEeiSgh62havBcemCIK0gqj809wX6UA0uPISNMRnR6NZyCdGzX3SbLrgwL';
  let heicLib = null;
  async function isHeic(file) {
    if (/image\/hei[cf]/i.test(file.type || '') || /\.hei[cf]$/i.test(file.name || '')) return true;
    try {
      const b = new Uint8Array(await file.slice(4, 12).arrayBuffer());

    } catch (e) { return false; }
  }
  function loadHeicLib() {
    if (window.heic2any) return Promise.resolve(window.heic2any);

        const el = document.createElement('script');
        el.src = HEIC_LIB; el.integrity = HEIC_SRI; el.crossOrigin = 'anonymous';
        el.onload = () => (window.heic2any ? resolve(window.heic2any) : reject(new Error('lib')));

    try {

    }
